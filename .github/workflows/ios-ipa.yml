name: iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run www

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Generate iOS icons and splash
        run: npx capacitor-assets generate --ios --assetPath resources

      - name: Inspect iOS project
        run: ls -la ios/App

      - name: Set iOS version
        working-directory: ios/App
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          BUILD=$(node -e "const fs=require('fs');const t=fs.readFileSync('../../android/app/build.gradle','utf8');console.log((t.match(/versionCode\\s+(\\d+)/)||[])[1]||'1')")
          echo "iOS version: $VERSION ($BUILD)"
          agvtool new-marketing-version "$VERSION" || true
          agvtool new-version -all "$BUILD" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" App/Info.plist

      - name: Build unsigned app
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then
            TARGET=(-workspace App.xcworkspace)
          else
            TARGET=(-project App.xcodeproj)
          fi
          xcodebuild "${TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p ios/App/build/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r "seabattle-${VERSION}-unsigned.ipa" Payload

      - name: Verify IPA
        run: |
          IPA=$(ls ios/App/build/seabattle-*-unsigned.ipa)
          unzip -p "$IPA" Payload/App.app/Info.plist > /tmp/AppInfo.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/AppInfo.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" /tmp/AppInfo.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: seabattle-ipa
          path: ios/App/build/seabattle-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
